services:
  db:
    image: mysql:8.0
    container_name: ticket-manager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticket_manager
    ports:
      # 3307 on the host so it does not clash with a local XAMPP/MySQL on 3306
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Runs once, only when db_data is empty: creates schema + demo data
      - ./sql/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build: .
    container_name: ticket-manager-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ticket_manager
      DB_USER: root
      DB_PASS: root
      BASE_URL: http://localhost:8080/
    ports:
      - "8080:80"
    volumes:
      # Live-mount the source so edits show up without rebuilding
      - .:/var/www/html

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ticket-manager-pma
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

volumes:
  db_data:
